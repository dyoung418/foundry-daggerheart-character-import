# Release workflow, based on the League of Foundry Developers module template
# (https://github.com/League-of-Foundry-Developers/FoundryVTT-Module-Template).
#
# Publish a GitHub Release whose tag is vX.Y.Z. This workflow then:
#   1. runs the tests,
#   2. fills the VERSION / URL / MANIFEST / DOWNLOAD tokens in module.json,
#   3. zips the module and attaches module.json + module.zip to that release,
#   4. if the FOUNDRY_PACKAGE_RELEASE_TOKEN secret is set, registers the version with
#      foundryvtt.com through the Package Release API.
#
# The manifest URL is the stable releases/latest/download link; the download URL points at
# the zip of this specific release (Foundry community wiki: "Package Releases and Version
# History"). Release notes are written in the GitHub Release body (use "Generate release
# notes" or `gh release create --generate-notes`); CHANGELOG.md is maintained by hand.

name: Release

env:
  project_url: "https://github.com/${{ github.repository }}"
  latest_manifest_url: "https://github.com/${{ github.repository }}/releases/latest/download/module.json"
  release_manifest_url: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.json"
  release_module_url: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip"

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run tests
        run: npm test

      # Accepts tags "v1.2.3" or "1.2.3"; exposes version-without-v.
      - name: Extract version from tag
        id: get_version
        uses: battila7/get-version-action@v2

      # Fills the placeholder tokens in module.json (only in the runner's checkout).
      - name: Fill release values into module.json
        uses: cschleiden/replace-tokens@v1
        with:
          files: 'module.json'
        env:
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
          URL: ${{ env.project_url }}
          MANIFEST: ${{ env.latest_manifest_url }}
          DOWNLOAD: ${{ env.release_module_url }}

      - name: Check manifest
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync("module.json", "utf8"));
            for (const k of ["version", "url", "manifest", "download"]) {
              if (!m[k] || /^[A-Z]+$/.test(m[k])) throw new Error(`module.json ${k} not filled: ${m[k]}`);
            }
            console.log(`module ${m.id} ${m.version}\n  manifest ${m.manifest}\n  download ${m.download}`);
          '

      - name: Create module archive
        run: |
          zip --recurse-paths ./module.zip \
            module.json README.md CHANGELOG.md LICENSE \
            scripts/ styles/ templates/ lang/ data/

      - name: Attach module.json and module.zip to the release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./module.zip'
          tag: ${{ github.event.release.tag_name }}

      # Optional: publish to the foundryvtt.com package listing. Needs the package registered
      # at https://foundryvtt.com/packages/daggerheart-character-import and its release token
      # stored as the repository secret FOUNDRY_PACKAGE_RELEASE_TOKEN.
      - name: Register the release with foundryvtt.com
        if: ${{ env.FOUNDRY_TOKEN != '' }}
        uses: cs96and/FoundryVTT-release-package@v1
        env:
          FOUNDRY_TOKEN: ${{ secrets.FOUNDRY_PACKAGE_RELEASE_TOKEN }}
        with:
          package-token: ${{ secrets.FOUNDRY_PACKAGE_RELEASE_TOKEN }}
          manifest-url: ${{ env.release_manifest_url }}
          notes-url: "https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}"
